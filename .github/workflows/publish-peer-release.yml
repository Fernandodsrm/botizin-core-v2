name: Publish verified S3 address discovery release
on:
  push:
    branches: [s3-peer-discovery-20261008]
    paths: ['release-activation.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: botizin-peer-release-S3
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify source build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,json,os,pathlib
          a=json.loads(pathlib.Path('release-activation.json').read_text())
          assert a=={'device':'S3','version':'0.0.16'}
          req=urllib.request.Request('https://api.github.com/repos/Fernandodsrm/botizin-core-v2/actions/runs/37738368315',headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})
          r=json.load(urllib.request.urlopen(req,timeout=30))
          assert r['conclusion']=='success' and r['head_sha']=='78eea2c70e0a642913469f28c80d143bff50a0ec'
          print('PINNED_BUILD_VERIFIED')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: botizin-78eea2c70e0a642913469f28c80d143bff50a0ec
          path: release-package
          run-id: 37738368315
          github-token: ${{ github.token }}
      - name: Publish pinned image and manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEVICE: S3
          VERSION: 0.0.16
          SOURCE_COMMIT: 78eea2c70e0a642913469f28c80d143bff50a0ec
          IMAGE_BYTES: 1204144
          IMAGE_SHA256: 3327b8fa33143bab9ac9187921b12037ed0b62911a2ba45cdcc13ecba2812430
          BASE_VERSION: 0.0.13
          BASE_SHA256: db682f24db7af0624f4ed0603738d6536643ce7cb5e34eb08a5e99ff4fc8adab
        run: python3 tools/publish_peer_release.py
