name: Store independent WROOM packages without activation
on:
  push:
    branches: [wroom-independente-20261009]
    paths: ['independent-release-storage.json']
permissions:
  contents: write
  actions: read
jobs:
  store:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 37968551099
          name: botizin-ps4-13de077384711772bc8d2174ff2ab33a2411ba8d
          path: artifact-ps4
      - name: Verify exact source, partitions, sizes and SHA256 before storing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/store_independent_releases.py
