name: Test temporary BOTIZIN Windows hub

on:
  push:
    branches: ['lab/windows-hub-a22-offline-20261113']
    paths:
      - 'tools/windows_hub/**'
      - '.github/workflows/test-windows-hub.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: PowerShell 5.1 syntax check
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path 'tools/windows_hub/start_windows_hub.ps1').Path,
              [ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
          }
          Write-Host 'WINDOWS_POWERSHELL_SYNTAX_OK'
      - name: Python restricted HTTP handlers and identity test
        shell: pwsh
        run: |
          python -m py_compile tools/windows_hub/windows_mcp.py
          python tools/windows_hub/windows_mcp.py --self-test
      - name: Validate official SDK v2 interface
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check 'mcp>=2,<3'
          python -c 'from mcp.server import MCPServer; print("MCP_SERVER_V2_IMPORT_OK")'
