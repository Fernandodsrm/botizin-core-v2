name: Offer S3 maintenance trial 0.0.15 and restore baseline
on:
  push:
    branches: [s3-maintenance-trial-15]
    paths: [.github/workflows/offer-maintenance15.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: s3-timed-trial-offer
  cancel-in-progress: false
jobs:
  offer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download exact successful compilation
        uses: actions/download-artifact@v4
        with:
          name: botizin-5918d60127aa2a3688df3968dee614480ba202d4
          run-id: 37664816919
          github-token: ${{ github.token }}
          path: trial-package
      - name: Validate image, offer for five minutes, restore manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_COMMIT: 5918d60127aa2a3688df3968dee614480ba202d4
          EXPECTED_IMAGE_SHA256: 64d3ab72abafc46cadbe4b6b6092624fbdf182f780765dbcdf2b9cc323de3c71
        run: python3 ci/offer_timed_trial.py
