name: Validate BOTIZIN A22 recovery scripts
on:
  push:
    branches: [main]
    paths: ['tools/a22/**', '.github/workflows/validate-a22.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Syntax and smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/a22/supervisor_linux.py tools/a22/supervisor_termux.py tools/a22/mapear_rede.py tools/a22/install_wroom_led_mcp.py
          bash -n tools/a22/instalar_autorecuperacao.sh
          bash -n tools/a22/atualizar_supervisor_v2.sh
          bash -n tools/a22/ativar_led_no_chatgpt.sh
          python3 tools/a22/test_supervisors.py
