name: Wi-Fi 2.1 CORE 0.0.27 (binario na branch candidata)
on:
  push:
    branches: ['candidate/wifi2-ux-0.0.27']
    paths:
      - 'firmware/**'
      - 'tests/s3_wifi_recursos_lab_test.py'
      - '.github/workflows/s3-wifi-recursos-lab-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-compare:
    if: github.repository == 'Fernandodsrm/botizin-core-v2' && github.ref == 'refs/heads/candidate/wifi2-ux-0.0.27'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout branch (publicacao apenas no branch candidato)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Static invariants and JS syntax (sem placa)
        run: |
          set -euo pipefail
          python3 tests/s3_wifi_recursos_lab_test.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('firmware/panel_page.h').read_text()
          h = re.search(r'R"BTZN\((.*?)\)BTZN"', s, re.S).group(1)
          Path('/tmp/s3-wifi-recursos.js').write_text(re.search(r'<script>(.*?)</script>', h, re.S).group(1))
          PY
          node --check /tmp/s3-wifi-recursos.js
          g++ -std=c++17 -Wall -Wextra -Werror tests/event_ring_test.cpp -o /tmp/s3-event-test
          /tmp/s3-event-test
          g++ -std=c++17 -Wall -Wextra -Werror tests/ota_confirmation_test.cpp -o /tmp/s3-ota-test
          /tmp/s3-ota-test
          test -z "$(git diff f2ec674d2d354c41b591255ae491b275438615e3 -- firmware/peer_auth.h manifest.json)"
      - name: Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - name: Install pinned ESP32 core and MQTT dependency
        run: |
          set -euo pipefail
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install 'PubSubClient@2.8'
      - name: Build baseline historica somente para comparar tamanho
        run: |
          set -euo pipefail
          mkdir -p /tmp/botizin-report
          git worktree add --detach /tmp/botizin-base f2ec674d2d354c41b591255ae491b275438615e3
          (cd /tmp/botizin-base && unset BOTIZIN_TB_DEVICE_TOKEN && python3 ci/build.py)
          cp /tmp/botizin-base/dist/build-record.json /tmp/botizin-report/baseline.json
      - name: Build CORE 0.0.27 sem ThingsBoard
        run: |
          set -euo pipefail
          unset BOTIZIN_TB_DEVICE_TOKEN
          python3 ci/build.py
          python3 - <<'PY'
          import json, pathlib
          baseline = json.loads(pathlib.Path('/tmp/botizin-report/baseline.json').read_text())
          lab = json.loads(pathlib.Path('dist/build-record.json').read_text())
          assert lab['published'] is False and lab['publishable'] is False
          assert baseline['version'] == '0.0.25' and lab['version'] == '0.0.27'
          delta = lab['bytes'] - baseline['bytes']
          report = ('COMPILACAO LAB SEM PUBLICACAO\n'
                    f'BASE: {baseline["bytes"]} bytes\n'
                    f'LAB:  {lab["bytes"]} bytes\n'
                    f'DELTA_FIRMWARE: {delta:+d} bytes\n'
                    'RAM_INCREMENTAL: PENDENTE DE MEDICAO FISICA\n')
          print(report)
          pathlib.Path('size-comparison.txt').write_text(report)
          assert delta <= 65536, 'Excedeu o teto provisório de crescimento de 64 KiB'
          assert lab['bytes'] <= 3145728
          PY
      - name: Verificar identidade e ausencia ThingsBoard
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          record=json.loads(Path('dist/build-record.json').read_text())
          image=Path('dist/firmware.bin').read_bytes()
          assert record['published'] is False and record['publishable'] is False
          assert record['device_token_compiled'] is False and record['thingsboard_enabled'] is False
          assert b'thingsboard.cloud' not in image
          assert b'VALIDATION_ONLY_NOT_A_DEVICE_TOKEN' not in image
          assert b'CANDIDATE_BUILD: WIFI2_UX_027 (EXPERIMENTAL)' in image
          assert b'OTA_CANDIDATE_POLICY: OTA_ORIGINAL_RESTORED' in image
          assert image.startswith(b'\xe9') and len(image)<=3145728
          print('WIFI2_UX_027_TEST_ONLY_IMAGE_OK',len(image))
          PY
      - name: Publicar BIN de teste somente na branch candidata (main intocada)
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/candidate/wifi2-ux-0.0.27'
          test "$(git branch --show-current)" = 'candidate/wifi2-ux-0.0.27'
          mkdir -p packages/wifi2-0.0.27
          cp dist/firmware.bin packages/wifi2-0.0.27/firmware.bin
          cp dist/firmware.bin.sha256 packages/wifi2-0.0.27/firmware.bin.sha256
          cp dist/build-record.json packages/wifi2-0.0.27/build-record.json
          git add -f packages/wifi2-0.0.27/firmware.bin packages/wifi2-0.0.27/firmware.bin.sha256 packages/wifi2-0.0.27/build-record.json
          if git diff --cached --quiet; then
            echo 'BIN candidato ja atualizado'
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(wifi2): candidato 0.0.27 sem ThingsBoard (nao e release)'
            git push origin HEAD:refs/heads/candidate/wifi2-ux-0.0.27
          fi
      - name: Save isolated LAB test image (NOT a release)
        uses: actions/upload-artifact@v4
        with:
          name: WIFI2-UX-027-TEST-CANDIDATE
          path: |
            dist/firmware.bin
            dist/firmware.bin.sha256
            dist/build-record.json
          retention-days: 7
          if-no-files-found: error
      - name: Save report only (never firmware for deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3-wifi-recursos-report
          path: |
            dist/build-record.json
            dist/compile.log
            size-comparison.txt
          retention-days: 14
          if-no-files-found: warn
