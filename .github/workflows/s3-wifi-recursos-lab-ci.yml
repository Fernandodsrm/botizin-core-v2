name: S3 Wi-Fi + Recursos LAB (sem publicar)
on:
  push:
    branches: ['lab/s3-wifi-recursos-readonly-01']
    paths:
      - 'firmware/**'
      - 'tests/s3_wifi_recursos_lab_test.py'
      - '.github/workflows/s3-wifi-recursos-lab-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-compare:
    if: github.repository == 'Fernandodsrm/botizin-core-v2' && github.ref == 'refs/heads/lab/s3-wifi-recursos-readonly-01'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout branch (sem credenciais de push)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Static invariants and JS syntax (sem placa)
        run: |
          set -euo pipefail
          python3 tests/s3_wifi_recursos_lab_test.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('firmware/panel_page.h').read_text()
          h = re.search(r'R"BTZN\((.*?)\)BTZN"', s, re.S).group(1)
          Path('/tmp/s3-wifi-recursos.js').write_text(re.search(r'<script>(.*?)</script>', h, re.S).group(1))
          PY
          node --check /tmp/s3-wifi-recursos.js
          g++ -std=c++17 -Wall -Wextra -Werror tests/event_ring_test.cpp -o /tmp/s3-event-test
          /tmp/s3-event-test
          g++ -std=c++17 -Wall -Wextra -Werror tests/ota_confirmation_test.cpp -o /tmp/s3-ota-test
          /tmp/s3-ota-test
          test -z "$(git diff f2ec674d2d354c41b591255ae491b275438615e3 -- firmware/wifi_manager.h firmware/peer_auth.h manifest.json)"
      - name: Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - name: Install pinned ESP32 core and MQTT dependency
        run: |
          set -euo pipefail
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install 'PubSubClient@2.8'
      - name: Build original baseline with test-only token
        run: |
          set -euo pipefail
          mkdir -p /tmp/botizin-report
          git worktree add --detach /tmp/botizin-base f2ec674d2d354c41b591255ae491b275438615e3
          (cd /tmp/botizin-base && unset BOTIZIN_TB_DEVICE_TOKEN && python3 ci/build.py)
          cp /tmp/botizin-base/dist/build-record.json /tmp/botizin-report/baseline.json
      - name: Build LAB with same toolchain (no publish)
        run: |
          set -euo pipefail
          unset BOTIZIN_TB_DEVICE_TOKEN
          python3 ci/build.py
          python3 - <<'PY'
          import json, pathlib
          baseline = json.loads(pathlib.Path('/tmp/botizin-report/baseline.json').read_text())
          lab = json.loads(pathlib.Path('dist/build-record.json').read_text())
          assert lab['published'] is False and lab['publishable'] is False
          assert baseline['version'] == lab['version'] == '0.0.25'
          delta = lab['bytes'] - baseline['bytes']
          report = ('COMPILACAO LAB SEM PUBLICACAO\n'
                    f'BASE: {baseline["bytes"]} bytes\n'
                    f'LAB:  {lab["bytes"]} bytes\n'
                    f'DELTA_FIRMWARE: {delta:+d} bytes\n'
                    'RAM_INCREMENTAL: PENDENTE DE MEDICAO FISICA\n')
          print(report)
          pathlib.Path('size-comparison.txt').write_text(report)
          assert delta <= 65536, 'Excedeu o teto provisório de crescimento de 64 KiB'
          assert lab['bytes'] <= 3145728
          PY
      - name: Save report only (never firmware for deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3-wifi-recursos-report
          path: |
            dist/build-record.json
            dist/compile.log
            size-comparison.txt
          retention-days: 14
          if-no-files-found: warn
