name: Publish verified A22 Expresso environment
on:
  push:
    branches: [wroom-independente-20261009]
    paths: ['a22-release-storage.json']
permissions:
  contents: write
  actions: read
jobs:
  store:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 38073862432
          name: botizin-a22-91c536adc74dd31e6607de16ff6f874a2126090a
          path: artifact-a22
      - name: Verify and publish environment, preserve existing catalog and Menu
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/store_a22_release.py
