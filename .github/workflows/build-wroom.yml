name: Build BOTIZIN ESP32-WROOM in cloud

on:
  push:
    branches: [wroom-cloud-build]
    paths:
      - 'wroom/**'
      - 'ci/build_wroom.py'
      - '.github/workflows/build-wroom.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Arduino CLI 1.5.1
        uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - name: Install exact ESP32 core 3.3.12
        run: |
          arduino-cli version
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Install pinned OLED libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "Adafruit BusIO@1.17.4" --no-deps
          arduino-cli lib install "Adafruit GFX Library@1.12.6" --no-deps
          arduino-cli lib install "Adafruit SSD1306@2.5.17" --no-deps
      - name: Validate S3 status parser
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror wroom/tests/peer_status_test.cpp -o /tmp/peer-status-test
          /tmp/peer-status-test
      - name: Validate bounded diagnostic sampler
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I wroom/tests/mock wroom/tests/diagnostic_sampler_test.cpp -o /tmp/diagnostic-sampler-test
          /tmp/diagnostic-sampler-test
      - name: Validate diagnostic parser
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror wroom/tests/diagnostic_parser_test.cpp -o /tmp/diagnostic-parser-test
          /tmp/diagnostic-parser-test
      - name: Validate OTA confirmation binding and expiry
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror wroom/tests/ota_confirmation_test.cpp -o /tmp/ota-confirmation-test
          /tmp/ota-confirmation-test
      - name: Validate OLED navigation and explicit confirmation
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror wroom/tests/navigation_test.cpp -o /tmp/navigation-test
          /tmp/navigation-test
      - name: Compile and validate firmware package
        run: python3 ci/build_wroom.py
      - name: Save firmware, manifest, ELF and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: botizin-wroom-${{ github.sha }}
          path: dist-wroom/
          if-no-files-found: error
          retention-days: 30
