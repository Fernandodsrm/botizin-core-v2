name: Publish XiaoZhi LAB 0.0.26 — limited automatic OTA trial
on:
  push:
    paths:
      - '.github/workflows/publish-xiaozhi-lab-026.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xiaozhi-lab-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify already-published firmware in the public repository
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c %s releases/0.0.26/firmware.bin)" -eq 1942976
          echo 'c4a83a5a41de7b84c9afd088c0d81decec2563f406506d88ec2873cfe7f658c4  releases/0.0.26/firmware.bin' | sha256sum -c -
          echo 'EXISTING XIAOZHI IMAGE VERIFIED'
      - name: Publish firmware and temporarily point the automatic OTA manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases/0.0.26
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('manifest.json')
          j=json.loads(p.read_text())
          assert j['version']=='0.0.25' and j['board']=='esp32s3-n16r8', 'Manifest unexpectedly modified'
          j.update(version='0.0.26',size=1942976,sha256='c4a83a5a41de7b84c9afd088c0d81decec2563f406506d88ec2873cfe7f658c4',url='https://raw.githubusercontent.com/Fernandodsrm/botizin-core-v2/main/releases/0.0.26/firmware.bin')
          p.write_text(json.dumps(j,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          git commit -m 'release(lab): publish verified XiaoZhi 0.0.26 for one OTA trial'
          git push origin HEAD:main
      - name: Disable automatic reinstallation after the trial window
        shell: bash
        run: |
          set -euo pipefail
          sleep 540
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('manifest.json')
          j=json.loads(p.read_text())
          if j.get('version')!='0.0.26' or j.get('sha256')!='c4a83a5a41de7b84c9afd088c0d81decec2563f406506d88ec2873cfe7f658c4':
              raise SystemExit('Manifest changed elsewhere, refusing to override')
          j.update(version='0.0.25',size=1259872,sha256='bc68a1c45c43f4b0e63d40767521b50290a664725568cd0e6acfae24c37e049a',url='https://raw.githubusercontent.com/Fernandodsrm/botizin-core-v2/main/releases/0.0.25/firmware.bin')
          p.write_text(json.dumps(j,indent=2)+'\n')
          PY
          git add manifest.json
          git commit -m 'safety(ota): end XiaoZhi LAB trial window; keep binary archived'
          git push origin HEAD:main
