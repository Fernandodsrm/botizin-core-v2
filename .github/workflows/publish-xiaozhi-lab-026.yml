name: Publish XiaoZhi LAB 0.0.26 — limited automatic OTA trial
on:
  push:
    paths:
      - '.github/workflows/publish-xiaozhi-lab-026.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xiaozhi-lab-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download the exact successful CI artifact and verify firmware
        shell: bash
        env:
          ARTIFACT_ZIP_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-f130-820e-a5d5-21ff92b54d18/raw?se=2026-10-22T23%3A15%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=6901d8f6-0f10-53ff-9146-fc089c89fe83&skoid=fbc53507-c13f-4907-b4dd-0e03c91f5ad8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-22T09%3A39%3A33Z&ske=2026-10-23T09%3A39%3A33Z&sks=b&skv=2026-02-06&sig=mzt2lFssDux8flnlYBJU2d3KmQ6O%2BeC6RxAqfccIMus%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 12 --max-time 110 "$ARTIFACT_ZIP_URL" --output /tmp/xiaozhi-lab.zip
          unzip -p /tmp/xiaozhi-lab.zip build/xiaozhi.bin > /tmp/xiaozhi-lab.bin
          test "$(stat -c %s /tmp/xiaozhi-lab.bin)" -eq 1942976
          printf '%s  %s\n' 'c4a83a5a41de7b84c9afd088c0d81decec2563f406506d88ec2873cfe7f658c4' /tmp/xiaozhi-lab.bin | sha256sum -c -
          echo "VERIFIED: XiaoZhi native 1,942,976 bytes; OTA_1 only"
      - name: Publish firmware and temporarily point the automatic OTA manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases/0.0.26
          cp /tmp/xiaozhi-lab.bin releases/0.0.26/firmware.bin
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('manifest.json')
          j=json.loads(p.read_text())
          assert j['version']=='0.0.25' and j['board']=='esp32s3-n16r8', 'Manifest unexpectedly modified'
          j.update(version='0.0.26',size=1942976,sha256='c4a83a5a41de7b84c9afd088c0d81decec2563f406506d88ec2873cfe7f658c4',url='https://raw.githubusercontent.com/Fernandodsrm/botizin-core-v2/main/releases/0.0.26/firmware.bin')
          p.write_text(json.dumps(j,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/0.0.26/firmware.bin manifest.json
          git commit -m 'release(lab): publish verified XiaoZhi 0.0.26 for one OTA trial'
          git push origin HEAD:main
      - name: Disable automatic reinstallation after the trial window
        shell: bash
        run: |
          set -euo pipefail
          sleep 300
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('manifest.json')
          j=json.loads(p.read_text())
          if j.get('version')!='0.0.26' or j.get('sha256')!='c4a83a5a41de7b84c9afd088c0d81decec2563f406506d88ec2873cfe7f658c4':
              raise SystemExit('Manifest changed elsewhere, refusing to override')
          j.update(version='0.0.25',size=1259872,sha256='bc68a1c45c43f4b0e63d40767521b50290a664725568cd0e6acfae24c37e049a',url='https://raw.githubusercontent.com/Fernandodsrm/botizin-core-v2/main/releases/0.0.25/firmware.bin')
          p.write_text(json.dumps(j,indent=2)+'\n')
          PY
          git add manifest.json
          git commit -m 'safety(ota): end XiaoZhi LAB trial window; keep binary archived'
          git push origin HEAD:main
