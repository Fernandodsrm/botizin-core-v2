name: Profile WROOM 0.0.38 size (read-only laboratory builds)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-wroom-size.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - name: Install exact pinned ESP32 build core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Install exact pinned OLED libs
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "Adafruit BusIO@1.17.4" --no-deps
          arduino-cli lib install "Adafruit GFX Library@1.12.6" --no-deps
          arduino-cli lib install "Adafruit SSD1306@2.5.17" --no-deps
      - name: Build exact WROOM 0.0.38 and compare isolated code paths
        run: |
          python3 -m py_compile tools/wroom_profile/profile.py
          python3 tools/wroom_profile/profile.py
      - name: Upload reports ONLY, never firmware images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wroom38-code-size-report
          path: wroom-profile-results/
          if-no-files-found: warn
          retention-days: 14
