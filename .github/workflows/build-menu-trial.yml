name: Build WROOM temporary Menu (no offer)
on:
  push:
    branches: [wroom-menu-led-20261008]
    paths: ['wroom/menu-trial/**', 'wroom/tests/menu*', 'ci/build_menu_trial.py', '.github/workflows/build-menu-trial.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - name: Install fixed dependencies
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib update-index
          arduino-cli lib install "Adafruit BusIO@1.17.4" --no-deps
          arduino-cli lib install "Adafruit GFX Library@1.12.6" --no-deps
          arduino-cli lib install "Adafruit SSD1306@2.5.17" --no-deps
      - name: Validate preserved slot, timer and navigation
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror wroom/tests/menu_trial_return_test.cpp -o /tmp/menu-return
          /tmp/menu-return
          g++ -std=c++17 -Wall -Wextra -Werror wroom/tests/menu_model_test.cpp -o /tmp/menu-model
          /tmp/menu-model
      - name: Compile and verify chip, size and original partition table
        run: python3 ci/build_menu_trial.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wroom-menu-trial
          path: dist-menu-trial/
          retention-days: 14
