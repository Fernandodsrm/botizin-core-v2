name: OTA3 compat 0.0.25 (candidato com credencial teste)
on:
  push:
    branches: ['candidate/ota3-025-compat']
    paths:
      - 'firmware/**'
      - 'ci/build.py'
      - 'tests/ota3_025_compat_test.py'
      - '.github/workflows/ota3-025-compat-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    if: github.repository == 'Fernandodsrm/botizin-core-v2' && github.ref == 'refs/heads/candidate/ota3-025-compat'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Testes e JavaScript
        run: |
          set -euo pipefail
          python3 tests/ota3_025_compat_test.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('firmware/panel_page.h').read_text()
          html=re.search(r'R"BTZN\((.*?)\)BTZN"',text,re.S).group(1)
          Path('/tmp/ota3-025.js').write_text(re.search(r'<script>(.*?)</script>',html,re.S).group(1))
          PY
          node --check /tmp/ota3-025.js
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - name: Core ESP32 3.3.12
        run: |
          set -euo pipefail
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install 'PubSubClient@2.8'
      - name: Compilar sem credencial real e sem release
        run: |
          set -euo pipefail
          unset BOTIZIN_TB_DEVICE_TOKEN
          python3 ci/build.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          record=json.loads(Path('dist/build-record.json').read_text())
          image=Path('dist/firmware.bin').read_bytes()
          assert record['version']=='0.0.25-ota3'
          assert record['published'] is False and record['publishable'] is False
          assert record['device_token_compiled'] is False
          assert b'OTA3_025_COMPAT_FROM_ORIGINAL' in image
          assert b'OTA_AUTOMATIC_ENABLED: NO' in image
          assert len(image)<=3145728
          print('OTA3_025_BUILD_TEST_ONLY',len(image),record['sha256'])
          PY
      - name: Artefato candidato (sem token real, nao instalar)
        uses: actions/upload-artifact@v4
        with:
          name: OTA3-025-TEST-DUMMY-TELEMETRY-NOT-FOR-DEVICE
          path: |
            dist/firmware.bin
            dist/firmware.bin.sha256
            dist/build-record.json
            dist/compile.log
          retention-days: 7
          if-no-files-found: error
