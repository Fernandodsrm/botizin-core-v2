name: Build standalone PS4 module
on:
  push:
    branches: [wroom-ota-menu-20261008, wroom-independente-20261009]
    paths: ['wroom/ps4-module/**', 'ci/build_ps4_module.py', '.github/workflows/build-ps4.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - name: Install pinned Bluepad32 4.1.0 core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json,https://raw.githubusercontent.com/ricardoquesada/esp32-arduino-lib-builder/master/bluepad32_files/package_esp32_bluepad32_index.json
          arduino-cli core install esp32-bluepad32:esp32@4.1.0 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json,https://raw.githubusercontent.com/ricardoquesada/esp32-arduino-lib-builder/master/bluepad32_files/package_esp32_bluepad32_index.json
      - name: Install pinned OLED libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "Adafruit BusIO@1.17.4" --no-deps
          arduino-cli lib install "Adafruit GFX Library@1.12.6" --no-deps
          arduino-cli lib install "Adafruit SSD1306@2.5.17" --no-deps
      - name: Compile module and verify preserved partitions
        run: python3 ci/build_ps4_module.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: botizin-ps4-${{ github.sha }}
          path: dist-ps4/
          if-no-files-found: error
