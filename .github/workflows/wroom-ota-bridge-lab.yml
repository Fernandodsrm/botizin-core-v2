name: WROOM 038->040 OTA migration laboratory (NOT production)

on:
  push:
    branches: [wroom/ota-038-040-lab]
    paths:
      - 'tools/a22/ota_bridge_038_040.py'
      - 'tools/a22/test_ota_bridge_038_040.py'
      - '.github/workflows/wroom-ota-bridge-lab.yml'
      - 'ci/build_wroom.py'
      - 'wroom/firmware/**'

permissions:
  contents: write

jobs:
  offline-migration-and-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact isolated candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test A22 OTA slot gates without hardware
        run: |
          python3 -m py_compile tools/a22/ota_bridge_038_040.py
          python3 tools/a22/test_ota_bridge_038_040.py
      - name: Install Arduino CLI 1.5.1
        uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - name: Install exact ESP32 core 3.3.12
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Install pinned OLED libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "Adafruit BusIO@1.17.4" --no-deps
          arduino-cli lib install "Adafruit GFX Library@1.12.6" --no-deps
          arduino-cli lib install "Adafruit SSD1306@2.5.17" --no-deps
      - name: Compile and inspect WROOM 0.0.40 (never deploy)
        run: python3 ci/build_wroom.py
      - name: Require immutable laboratory firmware identity
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path("dist-wroom/0.0.40")
          rec=json.loads((root/"build-record.json").read_text())
          data=(root/"firmware.ino.bin").read_bytes()
          assert rec["version"]=="0.0.40" and rec["published"] is False
          assert rec["credentials_compiled"] is False and rec["partitions_verified"] is True
          assert rec["bytes"]==len(data)==1069744
          assert rec["sha256"]==hashlib.sha256(data).hexdigest()=="1a52d58619bdfa8fb7af505c40fc668dc35f233b184ced58f50be41bbe28ef51"
          assert data[:1]==b"\xe9"
          (root/"firmware.bin").write_bytes(data)
          print("OTA040_LAB_IDENTITY_VERIFIED, NOT INSTALLED")
          PY
      - name: Publish only an isolated prerelease binary, never main manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="wroom-040-ota-lab-1a52d586"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Prerelease tag already exists: will NOT overwrite asset"
            exit 0
          fi
          gh release create "$tag" \
            "dist-wroom/0.0.40/firmware.bin#firmware.bin" \
            "dist-wroom/0.0.40/build-record.json#build-record.json" \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "BOTIZIN WROOM 0.0.40 OTA LAB - not production" \
            --notes "Laboratory test image pinned by SHA256. Not published to main/wroom/manifest.json. Do not flash until staged 038 bridge and recovery checks are verified."
      - name: Preserve CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wroom-ota-bridge-lab-${{ github.sha }}
          path: dist-wroom/
          if-no-files-found: warn
          retention-days: 30
