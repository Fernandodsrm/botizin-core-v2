name: WROOM 038->040 OTA migration laboratory (NOT production)

on:
  push:
    branches: [wroom/ota-038-040-lab]
    paths:
      - 'tools/a22/ota_bridge_038_040.py'
      - 'tools/a22/test_ota_bridge_038_040.py'
      - '.github/workflows/wroom-ota-bridge-lab.yml'

permissions:
  actions: read
  contents: write

jobs:
  offline-migration-and-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact isolated candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test A22 OTA slot gates without hardware
        run: |
          python3 -m py_compile tools/a22/ota_bridge_038_040.py
          python3 tools/a22/test_ota_bridge_038_040.py
      - name: Download exact already-approved 0.0.40 CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 43261030671 \
            -R "$GITHUB_REPOSITORY" \
            -n botizin-wroom-2adad3f469c1bb55fa38f292f87b9abc031708a4 \
            -D dist-wroom
          test -s dist-wroom/0.0.40/firmware.ino.bin
          test -s dist-wroom/0.0.40/build-record.json
      - name: Require exact original laboratory firmware identity
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path("dist-wroom/0.0.40")
          rec=json.loads((root/"build-record.json").read_text())
          data=(root/"firmware.ino.bin").read_bytes()
          assert rec["source_commit"]=="2adad3f469c1bb55fa38f292f87b9abc031708a4"
          assert rec["version"]=="0.0.40" and rec["published"] is False
          assert rec["credentials_compiled"] is False and rec["partitions_verified"] is True
          assert rec["bytes"]==len(data)==1069744
          assert rec["sha256"]==hashlib.sha256(data).hexdigest()=="1a52d58619bdfa8fb7af505c40fc668dc35f233b184ced58f50be41bbe28ef51"
          assert data[:1]==b"\xe9"
          (root/"firmware.bin").write_bytes(data)
          print("ORIGINAL_OTA040_ARTIFACT_VERIFIED, NOT INSTALLED")
          PY
      - name: Publish only isolated prerelease, never the production main manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="wroom-040-ota-lab-1a52d586"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Prerelease already exists. Never overwrite the immutable candidate."
            exit 0
          fi
          gh release create "$tag" \
            "dist-wroom/0.0.40/firmware.bin#firmware.bin" \
            "dist-wroom/0.0.40/build-record.json#build-record.json" \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "BOTIZIN WROOM 0.0.40 OTA LAB - not production" \
            --notes "Exact binary from successful build 43261030671 at source commit 2adad3f. SHA256 1a52d58619bdfa8fb7af505c40fc668dc35f233b184ced58f50be41bbe28ef51. Does not modify main/wroom/manifest.json. Not installed on device."
      - name: Preserve laboratory CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wroom-ota-bridge-lab-${{ github.sha }}
          path: dist-wroom/
          if-no-files-found: warn
          retention-days: 30
