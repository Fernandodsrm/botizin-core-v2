name: Store verified Menu return-feedback package (no offer)
on:
  push:
    branches: [wroom-menu-feedback-20261008]
    paths: ['store-menu-package.json']
permissions:
  contents: write
  actions: read
jobs:
  store:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wroom-menu-trial
          path: menu-package
          run-id: 37739105822
          github-token: ${{ github.token }}
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/store_menu_package.py
