name: Offer authorized S3 timed trial and restore baseline
on:
  push:
    branches: [s3-timed-trial-20261007]
    paths: [.github/workflows/offer-timed-trial.yml, ci/offer_timed_trial.py]
permissions:
  contents: write
  actions: read
concurrency:
  group: s3-timed-trial-offer
  cancel-in-progress: false
jobs:
  offer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download exact successful compilation
        uses: actions/download-artifact@v4
        with:
          name: botizin-aa9e3340e50bb6f7a2ff2ba38e3418f1a89610b8
          run-id: 37577069359
          github-token: ${{ github.token }}
          path: trial-package
      - name: Validate image, offer briefly, restore manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/offer_timed_trial.py

# Retry brief offer: first window produced no observed installation.
