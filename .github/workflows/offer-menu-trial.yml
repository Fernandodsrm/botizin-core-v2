name: Offer authorized WROOM Menu trial and withdraw
on:
  push:
    branches: [wroom-menu-trial-20261007]
    paths: ['.github/workflows/offer-menu-trial.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: wroom-menu-trial-offer
  cancel-in-progress: false
jobs:
  offer:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify successful pinned build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,json,os
          req=urllib.request.Request('https://api.github.com/repos/Fernandodsrm/botizin-core-v2/actions/runs/37699024226',headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})
          run=json.load(urllib.request.urlopen(req,timeout=30))
          assert run['conclusion']=='success' and run['head_sha']=='4820db7e421026b27c63d26451edf46345c761b0'
          print('PINNED_BUILD_VERIFIED')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: wroom-menu-trial
          path: trial-package
          run-id: 37699024226
          github-token: ${{ github.token }}
      - name: Verify package, offer five minutes, restore baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_COMMIT: 4820db7e421026b27c63d26451edf46345c761b0
          EXPECTED_IMAGE_SHA256: 804bb9990271f430450e81d198ee9701b8d7b12d954b083041e98c5964070e4c
        run: python3 ci/offer_menu_trial.py
